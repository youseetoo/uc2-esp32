# Build + Release in youseetoo/uc2-esp32, and mirror artifacts to youseetoo/uc2-esp32-binaries
# One branch per tag in the binaries repo (branch name == tag)
name: Build and Release All Firmware

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      git-ref:
        description: "Git ref (optional)"
        required: false

env:
  GITHUB_REPO: "youseetoo/uc2-esp32"
  # Opt into Node.js 24 before the forced migration on 2026-06-16
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # T2.12: pure-ESP-IDF build matrix (D6). Builds every verified app via idf.py
  # (NO PlatformIO), merges bootloader+partitions+app into one flashable image
  # (idf.py merge-bin — flash params baked from the app's own sdkconfig, matching
  # build-frame's "freshly compiled bootloader" rule), and uploads <board_id>.bin.
  # fail-fast:false so one red board never masks the rest.
  #
  # IDF is provisioned by espressif/setup-espressif pinned to the D1 version (6.1).
  # Prefer a self-hosted runner / IDF container later (ci-cutover.md §1) by swapping
  # the "Set up ESP-IDF" step for `container: image: espressif/idf:release-v6.1` —
  # the build/merge/upload steps are unchanged.
  #
  # canopen_slave_motor is built once here (default axis); its 5 UC2_CAN_AXIS_ID
  # variants ("", X, Y, Z, A) are the build-frame.yaml per-axis loop, not this matrix.
  idf-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Phase 1/2 (ESP32-S3) ──
          - app: xiao_ledservo
            target: esp32s3
            board_id: "seeed_xiao_esp32s3_ledservo"
            chip_family: "ESP32-S3"
          - app: xiao_ledring
            target: esp32s3
            board_id: "seeed_xiao_esp32s3_ledring"
            chip_family: "ESP32-S3"
          - app: xiao_odmr
            target: esp32s3
            board_id: "seeed_xiao_esp32s3"
            chip_family: "ESP32-S3"
          - app: waveshare_ledarray
            target: esp32s3
            board_id: "waveshare_esp32s3_ledarray"
            chip_family: "ESP32-S3"
          - app: canopen_slave_laser
            target: esp32s3
            board_id: "uc2-can-slave-laser"
            chip_family: "ESP32-S3"
          - app: canopen_slave_led
            target: esp32s3
            board_id: "uc2-can-slave-led"
            chip_family: "ESP32-S3"
          - app: canopen_slave_gpio
            target: esp32s3
            board_id: "uc2-can-slave-gpio"
            chip_family: "ESP32-S3"
          - app: canopen_slave_galvo
            target: esp32s3
            board_id: "uc2-can-slave-galvo"
            chip_family: "ESP32-S3"
          - app: canopen_slave_accelmotor
            target: esp32s3
            board_id: "uc2-can-slave-accelmotor"
            chip_family: "ESP32-S3"
          - app: canopen_slave_motor
            target: esp32s3
            board_id: "uc2-can-slave-motor"
            chip_family: "ESP32-S3"
          - app: canopen_bridge_ptz
            target: esp32s3
            board_id: "uc2-can-bridge-ptz"
            chip_family: "ESP32-S3"
          - app: canopen_bridge_ps4_usbhost
            target: esp32s3
            board_id: "uc2-can-bridge-ps4-usbhost"
            chip_family: "ESP32-S3"
          # ── Phase 3 (classic ESP32, BT) ──
          - app: uc2_2
            target: esp32
            board_id: "esp32-uc2-standalone-2"
            chip_family: "ESP32"
          - app: uc2_3
            target: esp32
            board_id: "esp32-uc2-standalone-3"
            chip_family: "ESP32"
          - app: uc2_4
            target: esp32
            board_id: "esp32-uc2-standalone-4"
            chip_family: "ESP32"
          - app: uc2_wemos
            target: esp32
            board_id: "esp32-uc2-wemos"
            chip_family: "ESP32"
          - app: canopen_master
            target: esp32
            board_id: "uc2-can-master"
            chip_family: "ESP32"
          - app: canopen_standalone_v4
            target: esp32
            board_id: "uc2-can-standalone-v4"
            chip_family: "ESP32"
          # ── T5.4 (M5GFX-grouped, ESP32-S3 8MB) ──
          - app: m5stack_dial
            target: esp32s3
            board_id: "m5stack_dial"
            chip_family: "ESP32-S3"
          - app: waveshare_d7
            target: esp32s3
            board_id: "waveshare_d7"
            chip_family: "ESP32-S3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.ref }}
          submodules: recursive

      - name: Build + merge (idf.py)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: ${{ matrix.target }}
          command: idf.py build merge-bin
          path: apps/${{ matrix.app }}
          mkdir -p build/fw-images
          cp "apps/${{ matrix.app }}/build/${{ matrix.app }}-merged.bin" \
             "build/fw-images/${{ matrix.board_id }}.bin"
          ls -lh build/fw-images/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board_id }}
          path: build/fw-images/
          retention-days: 30

  create-release:
    needs: [idf-build]
    runs-on: ubuntu-latest
    # Run on tag pushes even when some matrix builds failed (partial failure is acceptable).
    # 'cancelled' / 'skipped' are excluded so we don't publish an empty release.
    if: |
      (needs.idf-build.result == 'success' || needs.idf-build.result == 'failure') &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -lh firmware/

      - name: Get release info
        id: release_info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create firmware index JSON
        run: |
          # set -e
          cd firmware
          TAG="${{ steps.release_info.outputs.tag }}"
          
          cat > firmware-index.json << INDEXEOF
          {
            "version": "$TAG",
            "generated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${{ env.GITHUB_REPO }}",
            "cdn_base": "https://raw.githubusercontent.com/youseetoo/uc2-esp32-binaries/refs/heads/${TAG}",
            "firmware": [
          INDEXEOF

          first=true
          for manifest in *-manifest.json; do
            [ -f "$manifest" ] || continue
            board_id="${manifest%-manifest.json}"

            if [ "$first" = true ]; then first=false; else echo "," >> firmware-index.json; fi

            name=$(jq -r '.name' "$manifest")
            chip=$(jq -r '.builds[0].chipFamily' "$manifest")

            cat >> firmware-index.json << EOF
              {
                "id": "$board_id",
                "name": "$name",
                "chipFamily": "$chip",
                "manifest": "${board_id}-manifest.json",
                "binary": "${board_id}.bin"
              }
          EOF
          done

          echo "]}" >> firmware-index.json
          
          # Show the index for debugging
          echo "==> firmware-index.json created:"
          cat firmware-index.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Firmware Release ${{ steps.release_info.outputs.tag }}"
          body: |
            ## UC2 Firmware Release ${{ steps.release_info.outputs.tag }}

            ### Download via jsDelivr CDN
            All firmware binaries and manifests are available via jsDelivr:
            ```
            https://cdn.jsdelivr.net/gh/youseetoo/uc2-esp32-binaries@${{ steps.release_info.outputs.tag }}/
            ```

            ### Flash with Web Flasher
            Use the [UC2 Web Flasher](https://youseetoo.github.io/flasher.html) to install firmware directly in your browser.

            ### Firmware Index
            - [firmware-index.json](https://cdn.jsdelivr.net/gh/youseetoo/uc2-esp32-binaries@${{ steps.release_info.outputs.tag }}/firmware-index.json)

            ### Available Boards
            See the firmware index or web flasher for a complete list of supported boards.
          files: |
            firmware/*.bin
            firmware/*-manifest.json
            firmware/firmware-index.json
          draft: false
          prerelease: ${{ contains(steps.release_info.outputs.tag, 'beta') || contains(steps.release_info.outputs.tag, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  canopen-check:
    name: CANopen registry drift check
    runs-on: ubuntu-latest
    needs: [idf-build]
    if: |
      (needs.idf-build.result == 'success' || needs.idf-build.result == 'failure') &&
      (github.event_name == 'push' || github.event_name == 'pull_request')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run CANopen registry drift check
        run: make canopen-check

  publish-binaries-repo:
    needs: create-release
    runs-on: ubuntu-latest
    # Mirror the same tolerance: run as long as create-release itself was not cancelled.
    if: |
      (needs.create-release.result == 'success' || needs.create-release.result == 'failure') &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          pattern: firmware-*
          merge-multiple: true

      - name: Get tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Checkout binaries repo
        uses: actions/checkout@v4
        with:
          repository: youseetoo/uc2-esp32-binaries
          path: binaries
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Create branch and copy artifacts
        shell: bash
        run: |
          # set -e
          TAG="${{ steps.tag.outputs.tag }}"
          cd binaries
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create a clean orphan branch per tag (no history)
          git checkout --orphan "$TAG"
          git rm -rf . 2>/dev/null || true

          # Copy all firmware files
          cp -v ../firmware/*.bin . || echo "No .bin files found"
          cp -v ../firmware/*-manifest.json . || echo "No manifest files found"
          
          # Create firmware-index.json if it doesn't exist
          if [ ! -f ../firmware/firmware-index.json ]; then
            echo "==> Creating firmware-index.json from manifests"
            cat > firmware-index.json << 'INDEXEOF'
          {
            "version": "TAG_PLACEHOLDER",
            "generated": "DATE_PLACEHOLDER",
            "repository": "youseetoo/uc2-esp32",
            "cdn_base": "CDN_PLACEHOLDER",
            "firmware": [
          INDEXEOF
          
            first=true
            for manifest in *-manifest.json; do
              [ -f "$manifest" ] || continue
              board_id="${manifest%-manifest.json}"
              
              if [ "$first" = true ]; then first=false; else echo "," >> firmware-index.json; fi
              
              name=$(jq -r '.name' "$manifest" 2>/dev/null || echo "Unknown")
              chip=$(jq -r '.builds[0].chipFamily' "$manifest" 2>/dev/null || echo "ESP32")
              
              cat >> firmware-index.json << EOF
              {
                "id": "$board_id",
                "name": "$name",
                "chipFamily": "$chip",
                "manifest": "${board_id}-manifest.json",
                "binary": "${board_id}.bin"
              }
          EOF
            done
          
            echo "]}" >> firmware-index.json
          
            # Replace placeholders
            sed -i "s|TAG_PLACEHOLDER|$TAG|g" firmware-index.json
            sed -i "s|DATE_PLACEHOLDER|$(date -u +%Y-%m-%dT%H:%M:%SZ)|g" firmware-index.json
            sed -i "s|CDN_PLACEHOLDER|https://raw.githubusercontent.com/youseetoo/uc2-esp32-binaries/refs/heads/${TAG}|g" firmware-index.json
          else
            cp -v ../firmware/firmware-index.json .
          fi
          
          echo "==> Files in binaries directory:"
          ls -lh

      - name: Rewrite manifests to absolute jsDelivr .bin URLs
        shell: bash
        run: |
          # set -e
          TAG="${{ steps.tag.outputs.tag }}"
          cd binaries
          BASE="https://raw.githubusercontent.com/youseetoo/uc2-esp32-binaries/refs/heads/${TAG}"

          echo "==> Rewriting manifests to use: $BASE"

          for manifest in *-manifest.json; do
            [ -f "$manifest" ] || continue
            board_id="${manifest%-manifest.json}"

            jq --arg url "${BASE}/${board_id}.bin" '
              .builds |= map(.parts |= map(.path = $url))
            ' "$manifest" > "${manifest}.tmp"
            mv "${manifest}.tmp" "$manifest"
            
            echo "  Updated: $manifest -> ${BASE}/${board_id}.bin"
          done

          jq --arg base "$BASE" '
            .firmware |= map(
              .manifest = ($base + "/" + (.manifest | split("/") | last)) |
              .binary   = ($base + "/" + (.binary   | split("/") | last))
            )
          ' firmware-index.json > firmware-index.json.tmp
          mv firmware-index.json.tmp firmware-index.json
          
          echo "  Updated firmware-index.json to use raw.githubusercontent.com"

      - name: Commit & push branch
        shell: bash
        run: |
          # set -e
          TAG="${{ steps.tag.outputs.tag }}"
          cd binaries
          git add .
          git commit -m "Firmware artifacts for ${TAG}"
          git push -f origin "$TAG"