; ============================================================================
; Shared base environments
; ============================================================================

[env:esp32_framework]
platform = https://github.com/platformio/platform-espressif32.git#v6.3.2
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.15
framework =
	espidf
	arduino
	debug_init_break = tbreak setup
	_monitor_filters = esp32_exception_decoder
	board_build.cmake_extra_args =
    -DCMAKE_C_COMPILER_LAUNCHER=ccache
    -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
;script now expects a folder like the env that its calling
;you can add a _debug behind the name to use the same pinconfig folder for a debug build
;like env:UC2_3 and env:UC2_3_debug

[env:esp32dev]
extends = env:esp32_framework
board = esp32dev
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = custom_partition.csv
board_upload.flash_size = 4MB
build_flags =
	-Wno-format
	-Wunused-variable
	-Wmissing-field-initializers
build_unflags = -Werror=all
upload_speed = 921600

[env:UC2_3_Xiao]
platform = espressif32@6.9.0
extends = env:esp32_framework
board = seeed_xiao_esp32s3
board_build.flash_mode = qio
board_build.partitions = custom_partition_esp32s3.csv
board_upload.flash_size = 4MB
build_unflags =
	-std=gnu++11
	-Werror=all
build_flags = 	-DARDUINO_USB_MODE=1
   				-DARDUINO_USB_CDC_ON_BOOT=1
lib_ignore = PSController
extra_scripts = pre:copy_PinConfig.py

[env:UC2_canopen_xiao_base]
extends = env:UC2_3_Xiao
lib_deps =
	paulstoffregen/OneWire@^2.3.7
	https://github.com/adafruit/Adafruit_NeoPixel.git
	teemuatlut/TMCStepper@^0.7.3
	gin66/FastAccelStepper @ ^0.31.5
	https://github.com/youseetoo/AccelStepper.git
	; Pinned: ESP32Encoder master moved to the ESP-IDF-5 PCNT driver and its
	; ctor init-list no longer matches the member declaration order (-Wreorder).
	; 0.12.0 is the last release before that migration, and matches the spec
	; used by the non-CANopen envs below.
	madhephaestus/ESP32Encoder@^0.12.0
	symlink://lib/uc2_od
	symlink://lib/ESP32_CanOpenNode
lib_ldf_mode = deep+
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.15
upload_speed = 921600
build_flags =
	${env:UC2_3_Xiao.build_flags}
	-DESP32S3_MODEL_XIAO=1
	-DMESSAGE_CONTROLLER=1
	-DDIGITAL_IN_CONTROLLER=1
	-DCAN_BUS_ENABLED=1
	-DCAN_CONTROLLER_CANOPEN=1
