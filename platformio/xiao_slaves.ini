; ============================================================================
; CANopen XIAO slave & bridge nodes
; ============================================================================

; --- Motor slave (node-id 10-15, one FocusMotor axis per node) ---
[env:UC2_canopen_slave_motor]
extends = env:UC2_canopen_xiao_base
build_flags =
	${env:UC2_canopen_xiao_base.build_flags}
	-DNODE_ROLE=2
	-DMOTOR_CONTROLLER=1
	-DHOME_MOTOR=1
	;-DUSE_ACCELSTEP=1
	-DUSE_FASTACCEL=1
	-DTMC_CONTROLLER=1
	-DENCODER_CONTROLLER=1
	-DLINEAR_ENCODER_CONTROLLER=1
	-DCORE_DEBUG_LEVEL=5
board_build.cmake_extra_args =
	-DCONFIG=UC2_canopen_slave_motor
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:UC2_canopen_slave_motor.build_flags}

[env:UC2_canopen_slave_motor_release]
extends = env:UC2_canopen_slave_motor
; `extends` replaces build_unflags instead of merging it, so re-state the
; inherited unflags (-std=gnu++11, -Werror=all) or third-party library
; warnings become hard errors here but not in the other envs.
build_unflags =
	${env:UC2_3_Xiao.build_unflags}
	-DCORE_DEBUG_LEVEL=5
build_flags =
	${env:UC2_canopen_slave_motor.build_flags}

[env:UC2_canopen_slave_motor_debug]
extends = env:UC2_canopen_slave_motor
build_type = debug
build_flags =
	${env:UC2_canopen_slave_motor.build_flags}

