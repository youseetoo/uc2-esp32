name: Build FRAME images

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - '*'
  pull_request:
  merge_group:
  release:
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git ref (optional)'
        required: false

env:
  CTR_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  CTR_IMAGE_NAME: 'firmware-image-server'
  PUSH_CTR_IMAGE: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork || github.event_name == 'push' }}
  MAIN_BRANCH: 'main' # pushing to this branch will update the "edge" tag on the container image

jobs:
  # One release identity for the whole run: baked into every firmware image
  # (UC2_FW_VERSION, see tools/fw_version.py) and published as version.json on
  # the firmware server, so ImSwitch can compare boards against the server.
  fw-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version-string.outputs.version }}
      commit: ${{ steps.version-string.outputs.commit }}
      commit_time: ${{ steps.version-string.outputs.commit_time }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs history and tags

      - name: Determine version string
        id: version-string
        run: |
          # Get the SHA of the actual commit (not the fake merge commit) on PR-triggered runs
          # (refer to https://stackoverflow.com/a/68068674/23202949):
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            ACTUAL_SHA="${{ github.event.pull_request.head.sha }}"
          else
            # Note: we want to have a SHA to check out even in merge queues, so we always fall back
            # to a SHA even if it's a fictional SHA detached from any branches:
            ACTUAL_SHA="${{ github.sha }}"
          fi

          TAG="$(git describe --tags --exact-match --match "v*" "$ACTUAL_SHA" 2>/dev/null || printf "")"
          # --always: fall back to the bare SHA when no v* tag is reachable (e.g. forks)
          VERSION="$(git describe --tags --match "v*" --abbrev=7 --always "$ACTUAL_SHA")"
          # format-local (not format) so TZ=UTC applies; plain format: would use the author's timezone
          TIMESTAMP="$(TZ=UTC git show -s --format=%ad --date=format-local:'t%Y%m%d%H%M%S' "$ACTUAL_SHA")"

          if [[ "$VERSION" != "$TAG" ]]; then
            VERSION="$VERSION-$TIMESTAMP"
            if [[ -n "${{ github.event.pull_request.head.sha }}" ]]; then
              # We're in a pull request
              VERSION="$VERSION-pr${{ github.event.pull_request.number }}"
            fi
          fi

          echo "version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$ACTUAL_SHA" >> $GITHUB_OUTPUT
          echo "commit_time=$(TZ=UTC git show -s --format=%ad --date=format-local:'%Y-%m-%dT%H:%M:%SZ' "$ACTUAL_SHA")" >> $GITHUB_OUTPUT

  build-fw-images:
    runs-on: ubuntu-latest
    needs: fw-version
    env:
      UC2_FW_VERSION: ${{ needs.fw-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # envs: regex over the env names in platformio.ini; skip: regex of envs
        # to leave to another job. release_only builds the *_release variants,
        # otherwise the plain env (no _debug/_default/_Xiao/_release suffix).
        include:
          - {name: UC2_3,              envs: '^UC2_3',               skip: '', release_only: false}
          - {name: seeed_xiao_esp32s3, envs: '^seeed_xiao_esp32s3', skip: '', release_only: false}
          # CANopen was one job of 14 sequential builds (the motor slave once
          # per axis); three jobs run them in parallel. New CANopen envs land
          # in one of them automatically.
          - {name: UC2_canopen_motor,  envs: '^UC2_canopen_slave_motor_', skip: '',                          release_only: true}
          - {name: UC2_canopen_slaves, envs: '^UC2_canopen_slave_',       skip: '^UC2_canopen_slave_motor_', release_only: true}
          - {name: UC2_canopen_master, envs: '^UC2_canopen_',             skip: '^UC2_canopen_slave_',       release_only: true}
          # Not built (add an entry with envs: '^<prefix>' to enable):
          # UC2_2, UC2_4, UC2_WEMOS, seeed_xiao_esp32c3, waveshare, esp32, m5stack, uc2lasercover

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      # Toolchains, ESP-IDF and the Arduino core (~2 GB per chip family):
      # restored instead of downloaded / git-cloned every run. One cache for
      # all jobs; each job installs both chip families' packages (next steps),
      # so whichever job saves first saves the complete set.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: pio-packages-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-packages-${{ runner.os }}-

      # PlatformIO's object cache (platformio.ini: build_cache_dir =
      # ~/.pio/build_cache). Every env compiles all of ESP-IDF + Arduino from
      # source; with a warm cache those objects are copied instead (locally a
      # clean env build dropped from ~115 s to ~25 s). A new cache is saved
      # whenever the sources change; the newest one for this job is restored.
      - name: Cache PlatformIO build objects
        uses: actions/cache@v4
        with:
          path: ~/.pio/build_cache
          key: pio-build-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('platformio.ini', 'sdkconfig.*', 'CMakeLists.txt', 'main/**', 'lib/**', 'include/**') }}
          restore-keys: pio-build-${{ runner.os }}-${{ matrix.name }}-

      # PlatformIO never prunes the object cache, and every commit adds
      # objects. Start over when it gets big (one slow run, then warm again)
      # so the saved caches stay well inside GitHub's 10 GB per repository.
      - name: Limit build cache size
        run: |
          size_mb=$(du -sm ~/.pio/build_cache 2>/dev/null | cut -f1 || echo 0)
          echo "build cache: ${size_mb:-0} MB"
          if [ "${size_mb:-0}" -gt 3000 ]; then
            echo "over 3000 MB - clearing"
            rm -rf ~/.pio/build_cache
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install PlatformIO and tools
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool
          # Both chip families (ESP32: UC2_3, ESP32-S3: CAN slaves), so the
          # shared package cache is complete whichever job saves it.
          pio pkg install -e UC2_3 -e UC2_canopen_slave_motor_release

      - name: Extract environment list
        id: get_envs
        run: |
          set -eux
          envs="$(pio project config | grep 'env:' | cut -d ':' -f 2 | sort -u | grep -E '${{ matrix.envs }}')"
          if [[ -n "${{ matrix.skip }}" ]]; then
            envs="$(grep -v -E '${{ matrix.skip }}' <<<"$envs")"
          fi
          if [[ "${{ matrix.release_only }}" == "true" ]]; then
            envs="$(grep -e '_release$' <<<"$envs")"
          else
            envs="$(grep -v -e '_debug$' -e '_default$' -e '_Xiao$' -e '_release$' <<<"$envs")"
          fi
          echo "Environments:"
          echo "$envs"
          echo "envs=$(echo "$envs" | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Build all environments
        run: |
          failed=""
          mkdir -p build/fw-images
          pio boards --json-output > boards.json
          IFS=',' read -ra ENVS <<< "${{ steps.get_envs.outputs.envs }}"
          for ENV in "${ENVS[@]}"; do
            echo "==> Building $ENV"
            # skip UC2_canopen_xiao_base for now since they fail to build in CI due to missing CAN library files
            if [[ "$ENV" == "UC2_canopen_xiao_base" ]]; then
              echo "⚠️ Skipping $ENV due to known build issues in CI."
              continue
            fi

            # CAN slave motor builds: compile once per axis (X/Y/Z/A) by injecting
            # -DCAN_AXIS_ID=CAN_ID_MOT_<X> via PLATFORMIO_BUILD_FLAGS, which PlatformIO
            # appends to existing build_flags without touching platformio.ini.
            if [[ "$ENV" == *"canopen_slave_motor"* ]]; then
              AXES=("" X Y Z A)
            else
              AXES=("")
            fi

            for AXIS in "${AXES[@]}"; do
            if [[ -n "$AXIS" ]]; then
              export PLATFORMIO_BUILD_FLAGS="-DCAN_AXIS_ID=CAN_ID_MOT_${AXIS}"
              AXIS_SUFFIX="_mot${AXIS}"
              echo "==> Building $ENV (axis: $AXIS)"
            else
              unset PLATFORMIO_BUILD_FLAGS
              AXIS_SUFFIX=""
            fi

            # UC2_FW_IMAGE = the file name this build is published as (see OUT_BIN
            # below); the firmware reports it so ImSwitch picks the matching image.
            if ! UC2_FW_IMAGE="esp32_${ENV}${AXIS_SUFFIX}.bin" pio run --environment "$ENV"; then
              echo "❌ Build failed for $ENV${AXIS_SUFFIX} — continuing with others."
              failed=true
              continue
            fi

            BIN_DIR=".pio/build/$ENV"
            if [[ ! -f "$BIN_DIR/firmware.bin" ]]; then
              echo "⚠️ Skipping merge for $ENV${AXIS_SUFFIX} — firmware.bin not found."
              failed=true
              continue
            fi

            # ------------------------------------------------------------------
            # Determine chip type directly from the environment name.
            #
            # A board lookup via 'pio project config | grep board' silently
            # fails for envs that inherit 'board' through 'extends' (e.g.
            # seeed_xiao_esp32s3 -> UC2_3_Xiao -> board = seeed_xiao_esp32s3).
            # When BOARD comes back empty the jq lookup returns nothing, CHIP
            # is empty, and the else branch fires -> wrong BOOT_ADDR / flash
            # params -> binary built for classic ESP32 -> boot-loop on S3.
            #
            # Matching on the ENV name is reliable for this project because
            # every environment name encodes the target chip:
            #   seeed_*  /  *esp32s3*  ->  ESP32-S3  (boot @ 0x0)
            #   *esp32c3*              ->  ESP32-C3  (boot @ 0x0)
            #   everything else        ->  classic ESP32 (boot @ 0x1000)
            #
            # NOTE: flash_mode / flash_freq / flash_size are intentionally NOT
            # forced here. They are taken verbatim from the compiled bootloader
            # header via "merge_bin --flash_mode keep ..." so the merged image is
            # byte-identical to what "pio run --target upload" flashes (which is
            # known to boot). Forcing qio/80m here previously produced a mismatch
            # between the (qio) bootloader and the (dio) app image baked by the
            # sdkconfig -> "invalid header" boot-loops after erase.
            # ------------------------------------------------------------------
            if [[ "$ENV" == seeed_* ]] || [[ "$ENV" == *"esp32s3"* ]] || [[ "$ENV" == *"canopen_slave"* ]]; then
              CHIP_ARG="esp32s3"
              BOOT_ADDR="0x0000"
            elif [[ "$ENV" == *"esp32c3"* ]]; then
              CHIP_ARG="esp32c3"
              BOOT_ADDR="0x0000"
            else
              CHIP_ARG="esp32"
              BOOT_ADDR="0x1000"
            fi

            echo "==> Copying binaries for $ENV${AXIS_SUFFIX} (chip: $CHIP_ARG, boot_addr: $BOOT_ADDR)"
            OUT_BIN="build/fw-images/esp32_${ENV}${AXIS_SUFFIX}.bin"
            cp "$BIN_DIR/firmware.bin" "$OUT_BIN"

            # Also produce a merged binary (bootloader + partitions + app in one file)
            # that can be flashed directly via esptool without specifying offsets:
            #
            #   esptool.py --chip <chip> write_flash 0x0 esp32_<ENV>_merged.bin
            #
            # Note: --target-offset is intentionally omitted so the merged image
            # starts at the lowest address present (the bootloader address).
            OUT_MERGED="build/fw-images/esp32_${ENV}${AXIS_SUFFIX}_merged.bin"
            BOOT_APP0="$(find ~/.platformio -name "boot_app0.bin" | head -1)"

            # ------------------------------------------------------------------
            # Bootloader selection for merged binary
            #
            # Always use the freshly COMPILED bootloader.bin from this build.
            # It matches the app image's flash mode/freq (both come from the same
            # sdkconfig) and is exactly what "pio run --target upload" flashes.
            #
            # Do NOT swap in a pre-built framework bootloader: it can be compiled
            # with different flash-mode/PSRAM settings than the app image, which
            # mixes a qio bootloader with a dio app -> bus corruption / invalid
            # header on the next boot (precisely the bug this used to cause).
            # ------------------------------------------------------------------
            BOOT_BIN="$BIN_DIR/bootloader.bin"

            if [[ -f "$BOOT_BIN" && -f "$BIN_DIR/partitions.bin" && -n "$BOOT_APP0" ]]; then
              echo "==> Merging binaries for $ENV${AXIS_SUFFIX} -> $OUT_MERGED"
              python -m esptool \
                --chip "$CHIP_ARG" \
                merge_bin \
                -o "$OUT_MERGED" \
                --flash_mode keep \
                --flash_freq keep \
                --flash_size keep \
                "$BOOT_ADDR" "$BOOT_BIN" \
                0x8000      "$BIN_DIR/partitions.bin" \
                0xe000      "$BOOT_APP0" \
                0x10000     "$BIN_DIR/firmware.bin"
            else
              echo "⚠️ Skipping merged binary for $ENV${AXIS_SUFFIX} — required files not found."
              echo "   BOOT_BIN       : ${BOOT_BIN:-MISSING}"
              echo "   partitions.bin : $(ls $BIN_DIR/partitions.bin 2>/dev/null || echo MISSING)"
              echo "   boot_app0.bin  : ${BOOT_APP0:-MISSING}"
            fi
            done  # axis loop
          done  # env loop
          if [ $failed == true ]; then
            echo "❌ One or more builds failed!"
            exit 1
          fi

      - name: Upload all merged binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-images-${{ matrix.name }}
          path: build/fw-images/

  build-server-ctr-image:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker-platform: linux/amd64
            gha-runner: ubuntu-24.04
          - docker-platform: linux/arm64
            gha-runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.gha-runner }}
    needs:
      - fw-version
      - build-fw-images
    steps:
      - uses: actions/checkout@v4

      - name: Download firmware images
        uses: actions/download-artifact@v4
        with:
          path: build/fw-images
          pattern: firmware-images-*
          merge-multiple: true

      # Served by Caddy at <server>/firmware/version.json (Dockerfile copies
      # build/fw-images to /srv). Read by ImSwitch's UC2ConfigController.
      - name: Write version.json
        run: |
          python3 tools/write_fw_manifest.py build/fw-images \
            --version "${{ needs.fw-version.outputs.version }}" \
            --commit "${{ needs.fw-version.outputs.commit }}" \
            --commit-time "${{ needs.fw-version.outputs.commit_time }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat build/fw-images/version.json

      # Work around a bug where capital letters in the GitHub username (e.g. "PlanktoScope") make it
      # impossible to push to GHCR. See https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase image registry and owner
        id: image_registry_case
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.CTR_IMAGE_REGISTRY }}/${{ env.CTR_IMAGE_NAME }}

      - name: Get Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_registry_case.outputs.lowercase }}
          tags: |
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_CTR_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          platforms: ${{ matrix.docker-platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fw-server-build-${{ matrix.docker-platform }}
          cache-to: type=gha,mode=max,scope=fw-server-build-${{ matrix.docker-platform }}
          outputs: type=image,name=${{ steps.image_registry_case.outputs.lowercase }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH_CTR_IMAGE }}

      - name: Export digest
        run: |
          mkdir -p /tmp/ctr-img-digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/ctr-img-digests/${digest#sha256:}"

      - name: Determine digest name
        run: |
          platform=${{ matrix.docker-platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ctr-image-digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/ctr-img-digests/*
          if-no-files-found: error
          retention-days: 1

  merge-ctr-images:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs:
      - build-server-ctr-image
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/ctr-img-digests
          pattern: ctr-image-digests-*
          merge-multiple: true

      - name: Lowercase image registry and owner
        id: image_registry_case
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ env.CTR_IMAGE_REGISTRY }}/${{ env.CTR_IMAGE_NAME }}

      - name: Get actual commit SHA
        run: |
          if [[ -n "${{ github.event.pull_request.head.sha }}" ]]; then
            printf "ACTUAL_SHA=%.7s" "${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          elif [[ ${{ env.PUSH_CTR_IMAGE }} = "true" ]]; then
            printf "ACTUAL_SHA=%.7s" "${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Get Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          IS_MAIN_BRANCH: ${{ github.ref == format('refs/heads/{0}', env.MAIN_BRANCH) }}
        with:
          images: ${{ steps.image_registry_case.outputs.lowercase }}
          tags: |
            type=match,pattern=${{ env.TAG_PREFIX }}(.*),group=1
            type=edge,branch=${{ env.MAIN_BRANCH }}
            type=ref,event=pr
            type=raw,value=sha-${{ env.ACTUAL_SHA }},enable=${{ env.ACTUAL_SHA != '' }},priority=100

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH_CTR_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: env.PUSH_CTR_IMAGE == 'true'
        working-directory: /tmp/ctr-img-digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image_registry_case.outputs.lowercase }}@sha256:%s ' *)

      - name: Inspect image
        if: env.PUSH_CTR_IMAGE == 'true'
        run: |
          docker buildx imagetools inspect \
            ${{ steps.image_registry_case.outputs.lowercase }}:${{ steps.meta.outputs.version }}

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build-fw-images
    if: github.event_name == 'push' && github.ref_type == 'tag'
    steps:
      # Note: this step is required for us to be able to determine the release tag:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download firmware images
        uses: actions/download-artifact@v4
        with:
          path: build/fw-images
          pattern: firmware-images-*
          merge-multiple: true

      - name: Determine release tag (or fallback)
        id: get_tag
        run: |
          TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "sha-$(git rev-parse --short HEAD)")
          echo "tag=$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Make new release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: build/fw-images/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
