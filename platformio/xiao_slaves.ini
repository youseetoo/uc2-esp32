build_type = debug
build_unflags =
	${env:UC2_3_Xiao.build_unflags}
	-DCORE_DEBUG_LEVEL=3
build_flags =
	${env:UC2_canopen_bridge_ps4_usbhost.build_flags}
	-DCORE_DEBUG_LEVEL=5

[env:UC2_canopen_bridge_ps4_usbhost_release]
