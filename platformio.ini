; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
build_cache_dir = ~/.pio/build_cache

; Native USB-Serial/JTAG: the DTR/RTS reset leaves the USB block un-reset, so
; HWCDC state leaks into the esptool 4.5.1 stub and it hangs on its first
; command. The ROM loader copes, so skip the stub. Baud is ignored on USB;
; keep 115200 so esptool never tries a change-baud round trip.
upload_flags = --no-stub
upload_speed = 115200

; Include split environment config files
extra_configs =
    platformio/_base.ini
    platformio/uc2_board.ini
    platformio/xiao_slaves.ini
    platformio/masters.ini
    platformio/boards.ini

	-DNODE_ROLE=2
	; PCNT-backed encoder — M5Dial's own Encoder class polls on GPIO 40/41
	madhephaestus/ESP32Encoder@^0.12.0