; ============================================================================
; CANopen master & standalone boards (ESP32-dev based)
; ============================================================================

; --- CANopen master (ESP32-dev, node-id 1, all controllers + DeviceRouter) ---
[env:UC2_canopen_master]
extends = env:esp32dev
lib_deps =
	https://github.com/adafruit/Adafruit_NeoPixel.git
	milesburton/DallasTemperature@^3.11.0
	paulstoffregen/OneWire@^2.3.7
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit GFX Library@^1.11.9
	teemuatlut/TMCStepper@^0.7.3
	madhephaestus/ESP32Encoder@^0.12.0
	symlink://lib/uc2_od
	symlink://lib/ESP32_CanOpenNode
lib_ignore =
	esp_usb_host_hid
lib_ldf_mode = deep+
upload_speed = 921600
build_flags =
	${env:esp32dev.build_flags}
	-DNODE_ROLE=1
	-DLASER_CONTROLLER=1
	-DDIGITAL_IN_CONTROLLER=1
	-DMESSAGE_CONTROLLER=1
	-DCAN_BUS_ENABLED=1
	-DDIAL_CONTROLLER=1
	-DMOTOR_CONTROLLER=1
	-DHOME_MOTOR=1
	-DBTHID=1
	-DTMC_CONTROLLER=1
	-DLED_CONTROLLER=1
	-DBLUETOOTH=1
	-DSTAGE_SCAN=1
	-DGALVO_CONTROLLER=1
	-DDAC_CONTROLLER=1
	-DCAN_CONTROLLER_CANOPEN=1
	-DTMP102_CONTROLLER=1
	-DFAN_CONTROLLER=1
	; Master is flashed via USB only — skip slave-side OTA receiver
	; (saves ~3 KB: watchdog task stack + OD-extension state).
	-DCANOPEN_OTA_NO_RECEIVER=1
	; PS4 controller only uses BT-classic; skip BLE controller init
	; to recover ~30 KB internal RAM so the BT scan has heap headroom.
	-DUC2_FORCE_BT_CLASSIC_ONLY=1
board_build.cmake_extra_args =
	-DCONFIG=UC2_canopen_master
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:UC2_canopen_master.build_flags}

[env:UC2_canopen_master_release]
extends = env:UC2_canopen_master
build_flags =
	${env:UC2_canopen_master.build_flags}
	-DCORE_DEBUG_LEVEL=0
board_build.cmake_extra_args =
	-DCONFIG=UC2_canopen_master
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:UC2_canopen_master_release.build_flags}

[env:UC2_canopen_master_debug]
extends = env:UC2_canopen_master
build_flags =
	${env:UC2_canopen_master.build_flags}
	-DCORE_DEBUG_LEVEL=5
board_build.cmake_extra_args =
	-DCONFIG=UC2_canopen_master
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:UC2_canopen_master_debug.build_flags}

; --- CANopen Hybrid on v4 standalone board (ESP32-dev, node-id 1, all controllers + DeviceRouter) ---
[env:UC2_canopen_standalone_v4_default]
extends = env:esp32dev
lib_deps =
	https://github.com/adafruit/Adafruit_NeoPixel.git
	milesburton/DallasTemperature@^3.11.0
	paulstoffregen/OneWire@^2.3.7
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit GFX Library@^1.11.9
	robtillaart/TCA9555    @ ^0.4.4
	symlink://lib/uc2_od
	symlink://lib/ESP32_CanOpenNode
	gin66/FastAccelStepper @ ^0.31.5

lib_ignore =
	esp_usb_host_hid
lib_ldf_mode = deep+
upload_speed = 921600
build_flags =
	${env:esp32dev.build_flags}
	-DNODE_ROLE=1
	-DUSE_TCA9535=1
	-DLASER_CONTROLLER=1
	-DDIGITAL_IN_CONTROLLER=1
	-DMESSAGE_CONTROLLER=1
	-DCAN_BUS_ENABLED=1
	#-DDIAL_CONTROLLER=1
	-DMOTOR_CONTROLLER=1
	-DHOME_MOTOR=1
 	#-DHEAT_CONTROLLER=1
	#-DDS18B20_CONTROLLER=1
	-DUSE_FASTACCEL=1
	-DLED_CONTROLLER=1
	;-DBTHID=1
	;-DBLUETOOTH=1
	; PS4 controller only uses BT-classic; skip BLE controller init
	; to recover ~30 KB internal RAM so the BT scan has heap headroom.
	-DUC2_FORCE_BT_CLASSIC_ONLY=1
	-DBTHID=1
	-DBLUETOOTH=1
	-DSTAGE_SCAN=1
	-DGALVO_CONTROLLER=1
	-DDAC_CONTROLLER=1
	-DCAN_CONTROLLER_CANOPEN=1
	; Standalone is flashed via USB and never bridges OTA to satellites,
	; so neither the slave-side receiver (~3 KB watchdog/state) nor the
	; master-side sender (~4 KB chunk buffer + /ota_start) is needed.
	-DCANOPEN_OTA_NO_RECEIVER=1
	-DCANOPEN_OTA_NO_SENDER=1

[env:UC2_canopen_standalone_v4_release]
extends = env:UC2_canopen_standalone_v4_default
build_flags =
	${env:UC2_canopen_standalone_v4_default.build_flags}
	-DCORE_DEBUG_LEVEL=0
board_build.cmake_extra_args =
	-DCONFIG=UC2_canopen_standalone_v4
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:UC2_canopen_standalone_v4_release.build_flags}

[env:UC2_canopen_standalone_v4_debug]
extends = env:UC2_canopen_standalone_v4_default
build_flags =
	${env:UC2_canopen_standalone_v4_default.build_flags}
	-DCORE_DEBUG_LEVEL=5
board_build.cmake_extra_args =
	-DCONFIG=UC2_canopen_standalone_v4
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:UC2_canopen_standalone_v4_debug.build_flags}
