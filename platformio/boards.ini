; ============================================================================
; Standalone board variants (non-CANopen)
; ============================================================================

[env:seeed_xiao_esp32s3]
extends = env:UC2_3_Xiao
lib_deps =
	milesburton/DallasTemperature@^3.11.0
	paulstoffregen/OneWire@^2.3.7
	adafruit/Adafruit IS31FL3741 Library@^1.2.2
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit GFX Library@^1.11.9
	https://github.com/youseetoo/AccelStepper.git
	https://github.com/adafruit/Adafruit_NeoPixel.git
	madhephaestus/ESP32Encoder@^0.12.0
lib_ignore = PSController, M5Dial, M5GFX, M5Unified
build_flags =
	${env:UC2_3_Xiao.build_flags}
	-DCORE_DEBUG_LEVEL=5
	-DESP32S3_MODEL_XIAO=1
	-DMOTOR_CONTROLLER=1	
	-DLASER_CONTROLLER=1
	-DLED_CONTROLLER=1
	-DDIGITAL_IN_CONTROLLER=1
	-DI2C_SLAVE_MOTOR=1
	-DMESSAGE_CONTROLLER=1
	-DUSE_ACCELSTEP=1
	-DLINEAR_ENCODER_CONTROLLER=1
	-DHEAT_CONTROLLER=1
	-DHOME_MOTOR=1
	-DSTAGE_SCAN=1
board_build.cmake_extra_args =
	-DCONFIG=seeed_xiao_esp32s3
	-DCMAKE_C_COMPILER_LAUNCHER=ccache
	-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
	${env:seeed_xiao_esp32s3.build_flags}

[env:seeed_xiao_esp32s3_ledservo]
extends = env:UC2_3_Xiao
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.15
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev//dev/cu.usbmodem1101
board = seeed_xiao_esp32s3
board_build.flash_mode = qio
lib_deps =
	paulstoffregen/OneWire@^2.3.7
  	https://github.com/adafruit/Adafruit_NeoPixel.git
	teemuatlut/TMCStepper@^0.7.3
lib_ignore =
	PSController
build_flags =
	${env:UC2_3_Xiao.build_flags}
	-DCORE_DEBUG_LEVEL=5
	-DESP32S3_MODEL_XIAO=1	
	-DLASER_CONTROLLER=1
	-DLED_CONTROLLER=1
	-DDIGITAL_IN_CONTROLLER=1
	-DMESSAGE_CONTROLLER=1
board_build.cmake_extra_args =
	-DCONFIG=seeed_xiao_esp32s3_ledservo
	${env:seeed_xiao_esp32s3_ledservo.build_flags}

[env:seeed_xiao_esp32s3_ledring]
extends = env:UC2_3_Xiao
platform = https://github.com/platformio/platform-espressif32.git
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#2.0.15
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev//dev/cu.usbmodem1101
board = seeed_xiao_esp32s3
board_build.flash_mode = qio
lib_deps =
	paulstoffregen/OneWire@^2.3.7
  	https://github.com/adafruit/Adafruit_NeoPixel.git
	teemuatlut/TMCStepper@^0.7.3
lib_ignore =
	PSController
build_flags =
	${env:UC2_3_Xiao.build_flags}
	-DCORE_DEBUG_LEVEL=5
	-DESP32S3_MODEL_XIAO=1	
	-DLASER_CONTROLLER=1
	-DDIGITAL_IN_CONTROLLER=1
	-DI2C_SLAVE_LASER=1
	-DMESSAGE_CONTROLLER=1
